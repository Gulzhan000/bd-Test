<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Аккаунт{% endblock %} · Ат Жол</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #edf3f8; color: #132c40; font: 16px/1.5 system-ui, sans-serif; }
    header { background: #173a53; color: white; }
    nav { max-width: 960px; margin: auto; padding: 15px 24px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
    nav a { color: white; }
    nav strong { margin-right: auto; font-size: 19px; }
    main { max-width: 620px; margin: 35px auto; padding: 28px; background: white; border: 1px solid #d8e3ec; border-radius: 14px; }
    h1 { margin: 0 0 18px; font-size: 31px; }
    label { display: block; font-weight: 650; margin-bottom: 4px; }
    input:not([type=hidden]) { display: block; width: 100%; max-width: 400px; padding: 8px 10px; border: 1px solid #8aa4b5; border-radius: 7px; font: inherit; }
    button { background: #12577a; color: white; padding: 9px 18px; border: 0; border-radius: 7px; font: inherit; cursor: pointer; }
    .helptext { display: block; font-size: 14px; color: #36566a; }
    .errorlist { color: #a01c27; padding-left: 22px; }
    a { color: #115679; }
    .captcha { margin-bottom: 8px; display: block; }
    @media (max-width: 650px) { main { margin: 20px 14px; padding: 22px; } }
  </style>
</head>
<body>
<header>
  <nav aria-label="Аккаунт">
    <strong>Ат Жол</strong>
    {% if user.is_authenticated %}
      <a href="{% url 'profile' %}">Личный кабинет</a>
      <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Выйти</button></form>
    {% else %}
      <a href="{% url 'login' %}">Войти</a>
      <a href="{% url 'register' %}">Регистрация</a>
    {% endif %}
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>

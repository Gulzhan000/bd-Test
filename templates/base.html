<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Ат Жол — конные туры</title><style>
body{font:18px Georgia,serif;background:#f6f3ec;color:#20382c;max-width:1000px;margin:40px auto;padding:0 24px}nav{display:flex;gap:24px;align-items:center;border-bottom:1px solid #c7cebd;padding-bottom:20px}a{color:#225d42}h1{font-size:42px}article{background:white;border:1px solid #dce1d6;padding:24px;margin:24px 0;border-radius:10px}button{background:#225d42;color:white;padding:12px 24px;border:0;border-radius:5px;font-size:17px;cursor:pointer}input,textarea,select{padding:9px;max-width:95%;display:block;font:inherit}.errorlist{color:#a52828}small{color:#67735e}.price{font-size:24px}label{display:block;margin-bottom:8px}</style></head>
<body><nav><a href="/">Ат Жол</a><a href="/profile/">Профиль</a>{% if user.is_staff %}<a href="/tours/new/">Добавить тур</a><a href="/categories/new/">Категории</a><a href="/admin/doc/">Документация</a>{% endif %}{% if user.is_authenticated %}<span>{{ user.username }}</span><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Выйти</button></form>{% else %}<a href="{% url 'login' %}">Войти</a>{% endif %}</nav>{% block content %}{% endblock %}</body></html>
